# feature54188/Pixel-Starry-Sky-Desktop 发版：推 v99.* 标签（如 v99.8.11-beta）→ 检查、建草稿 Release → Windows、macOS、Linux 各自打包，上传到同一个草稿。
# 在 GitHub 的 Releases 页检查草稿、写好更新说明后点发布，用户那边才会收到更新（版本号带 - 的测试版自动标成预发布）。
# 试打包：Actions 页手动运行（workflow_dispatch），三个系统照样检查、打包，安装包放在这次运行的 Artifacts 里，不建 Release。
name: release

on:
  push:
    tags: ['v99.*']
  workflow_dispatch:
    inputs:
      macos_tag:
        description: 补打已有草稿 Release 的 macOS 安装包（如 v99.8.22-beta）
        required: false
        type: string

permissions:
  contents: write

jobs:
  check:
    if: github.repository == 'feature54188/Pixel-Starry-Sky-Desktop'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # 按根目录 package.json 的 packageManager 装 pnpm
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 标签和版本号一致
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="v$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "标签 $GITHUB_REF_NAME 和 apps/desktop/package.json 的版本 $version 不一致"
            exit 1
          fi
      - name: 检查（类型、测试、ESLint、Prettier）
        run: node scripts/check.mjs
      # 先建好草稿：三个系统的安装包同时上传，Release 不存在时会各建一个草稿、文件分在几处
      - name: 建草稿 Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME 的 Release 已存在"
          else
            pre=""
            case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
            # 更新说明写在 .github/release-notes/<标签>.md（有就用，没有留空，到 Release 页再写）；应用里的「更新说明」显示的就是这段
            notes=".github/release-notes/$GITHUB_REF_NAME.md"
            if [ -f "$notes" ]; then
              gh release create "$GITHUB_REF_NAME" --draft $pre --verify-tag --title "${GITHUB_REF_NAME#v}" --notes-file "$notes"
            else
              gh release create "$GITHUB_REF_NAME" --draft $pre --verify-tag --title "${GITHUB_REF_NAME#v}" --notes ""
            fi
          fi

  package:
    needs: check
    strategy:
      # 一个系统打包失败不影响其他系统的上传，草稿里少了的到 Actions 页重跑那一个
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos_tag && '["macos-latest"]' || '["windows-latest","macos-latest","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: 取对应标签的应用源码
        if: inputs.macos_tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.macos_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main && "$RELEASE_TAG" =~ ^v99\.[0-9]+\.[0-9]+(-[a-zA-Z0-9.-]+)?$ ]]
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]]
          # 使用当前工作流的签名脚本和固定公钥；打包输入来自发布标签。
          mkdir -p "$RUNNER_TEMP/sign-tools/scripts" "$RUNNER_TEMP/sign-tools/apps/desktop/build"
          cp scripts/prepare-mac-signing.sh "$RUNNER_TEMP/sign-tools/scripts/"
          cp apps/desktop/build/macos-signing.pem "$RUNNER_TEMP/sign-tools/apps/desktop/build/"
          git fetch --no-tags --depth=1 origin "refs/tags/$RELEASE_TAG"
          git checkout --detach FETCH_HEAD
          [[ "v$(node -p "require('./apps/desktop/package.json').version")" == "$RELEASE_TAG" ]]
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      # node-pty 没有 Linux 的预编译文件，安装时要现场编译
      - name: Linux 编译工具
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3 make g++
      - run: pnpm install --frozen-lockfile
      - name: node-pty 能加载
        shell: bash
        working-directory: apps/desktop
        run: node -e "require('node-pty'); console.log('node-pty ok')"
      - name: 构建应用并检查命令行
        working-directory: apps/desktop
        run: pnpm --filter @pixelsky/cli exec node scripts/tools.mjs --release && pnpm build && pnpm --filter @pixelsky/cli smoke
      - name: 准备 macOS 固定签名身份
        if: runner.os == 'macOS' && (github.ref_type == 'tag' || inputs.macos_tag)
        env:
          MACOS_SIGNING_PRIVATE_KEY: ${{ secrets.MACOS_SIGNING_PRIVATE_KEY }}
          REPACK: ${{ inputs.macos_tag }}
        run: |
          script=scripts/prepare-mac-signing.sh
          if [[ -n "$REPACK" ]]; then script="$RUNNER_TEMP/sign-tools/$script"; fi
          bash "$script"
      - name: 打包并上传到草稿 Release
        working-directory: apps/desktop
        shell: bash
        run: |
          signing=()
          if [[ -n "${PIXELSKY_MAC_IDENTITY:-}" ]]; then
            signing+=("-c.mac.identity=$PIXELSKY_MAC_IDENTITY" "-c.forceCodeSigning=true")
          fi
          case "$RUNNER_OS" in
            macOS) targets=(--mac --x64 --arm64) ;;
            Windows) targets=(--win) ;;
            Linux) targets=(--linux) ;;
          esac
          pnpm exec electron-builder "${targets[@]}" "${signing[@]}" --publish ${{ github.ref_type == 'tag' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: 核对两个 macOS 安装包的应用签名
        if: runner.os == 'macOS' && (github.ref_type == 'tag' || inputs.macos_tag)
        working-directory: apps/desktop
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.macos_tag || github.ref_name }}
        run: |
          for arch in x64 arm64; do
            app_dir="$(mktemp -d "$RUNNER_TEMP/pixelsky-verify.XXXXXX")"
            ditto -x -k "release/PixelSky-${RELEASE_TAG#v}-mac-$arch.zip" "$app_dir"
            app="$app_dir/像素星空.app"
            codesign --verify --deep --strict "$app"
            codesign --verify -R="identifier \"com.pixelsky.desktop\" and certificate leaf = H\"$PIXELSKY_MAC_IDENTITY\"" "$app"
            codesign -d -r- "$app"
          done
      - name: 上传补打的 macOS 安装包
        if: inputs.macos_tag
        working-directory: apps/desktop/release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.macos_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]]
          gh release upload "$RELEASE_TAG" ./*.dmg ./*.zip ./*.blockmap ./latest-mac.yml --clobber
      - name: 试打包的安装包
        if: github.ref_type != 'tag' && !inputs.macos_tag
        uses: actions/upload-artifact@v4
        with:
          name: pixelsky-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.yml
          retention-days: 7
